<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>รายละเอียดเมนู | อาหารไทย ที่ต้องลอง</title>
<meta name="description" content="ดูรายละเอียดและส่วนประกอบของเมนูอาหารไทยแต่ละเมนู">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&family=Prompt:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #fff8ec;
    --surface: #ffffff;
    --text: #2b2118;
    --muted: #6b5a4a;
    --border: #f0dfc4;
    --accent: #d24e08;
    --on-accent: #ffffff;
    --accent-soft: #ffe8d6;
    --green: #2f7d4f;
    --shadow: 0 6px 20px rgba(120, 70, 20, .10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #1c1610;
      --surface: #2a2118;
      --text: #f6ead8;
      --muted: #c2ae95;
      --border: #3d3123;
      --accent: #ff8a3d;
      --on-accent: #1c1610;
      --accent-soft: #3d2a1a;
      --green: #6fcf97;
      --shadow: 0 6px 20px rgba(0, 0, 0, .35);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1c1610;
    --surface: #2a2118;
    --text: #f6ead8;
    --muted: #c2ae95;
    --border: #3d3123;
    --accent: #ff8a3d;
    --on-accent: #1c1610;
    --accent-soft: #3d2a1a;
    --green: #6fcf97;
    --shadow: 0 6px 20px rgba(0, 0, 0, .35);
  }

  *, *::before, *::after { box-sizing: border-box; }
  h1, h2, h3, p, ul { margin: 0; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans Thai", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.7;
  }
  .wrap { max-width: 920px; margin: 0 auto; padding-inline: 16px; }
  h1, h2, h3 { font-family: "Prompt", "Noto Sans Thai", sans-serif; line-height: 1.3; text-wrap: balance; }

  a { color: var(--accent); }
  a:focus-visible, .btn:focus-visible, .fav:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; border-radius: 4px; }
  .topbar { padding-block: 20px 8px; }
  .back { font-weight: 500; text-decoration: none; }
  .back:hover { text-decoration: underline; }

  .note {
    background: var(--accent-soft);
    border-bottom: 1px solid var(--border);
    text-align: center;
    font-size: .9rem;
    padding: 8px 16px;
  }

  /* Dish header */
  .dish {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: var(--shadow);
    margin-block: 12px 32px;
  }
  .pic {
    text-align: center;
    font-size: 7rem;
    padding: 32px 0 20px;
    background: linear-gradient(135deg, var(--accent-soft), transparent);
  }
  .pic.has-img { padding: 0; }
  .pic img { display: block; width: 100%; max-height: 460px; aspect-ratio: 16 / 10; object-fit: cover; }
  .dish-body { padding: 8px 24px 28px; display: flex; flex-direction: column; gap: 10px; }
  .head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
  .head h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); }
  .en { color: var(--muted); margin-top: -4px; }
  .desc { font-size: 1.05rem; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font-size: .95rem; }
  .meta b { color: var(--accent); letter-spacing: 2px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: .85rem; padding: 2px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .tag.cat { background: transparent; border: 1px solid var(--border); color: var(--muted); }

  .fav {
    flex: none;
    font: inherit;
    font-size: .9rem;
    cursor: pointer;
    min-height: 40px;
    padding: 2px 16px;
    border-radius: 999px;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    white-space: nowrap;
  }
  .fav[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

  /* Ingredients */
  .section-title { font-size: 1.6rem; margin-bottom: 4px; }
  .section-sub { color: var(--muted); margin-bottom: 20px; }
  .groups { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); }
  .group {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 20px;
  }
  .group h3 { font-size: 1.05rem; color: var(--green); margin-bottom: 8px; }
  .group ul { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .group li { position: relative; padding-left: 22px; }
  .group li::before { content: "•"; position: absolute; left: 6px; color: var(--accent); font-weight: 700; }

  /* Prev / next */
  .pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-block: 40px 0; }
  .btn {
    display: inline-block;
    font: inherit;
    font-weight: 500;
    text-decoration: none;
    color: var(--accent);
    border: 2px solid var(--accent);
    padding: 8px 20px;
    border-radius: 999px;
  }
  .btn:hover { background: var(--accent); color: var(--on-accent); }

  .missing { text-align: center; padding: 64px 16px; color: var(--muted); }
  .missing h1 { color: var(--text); font-size: 1.6rem; margin-bottom: 12px; }

  footer { text-align: center; padding: 32px 16px 48px; margin-top: 48px; color: var(--muted); font-size: .9rem; border-top: 1px solid var(--border); }
</style>
</head>
<body>

<div class="note" id="storageNote" role="status" hidden>บันทึกลงเครื่องนี้ไม่ได้ รายการที่ชอบจะหายเมื่อปิดหน้านี้</div>

<div class="wrap">
  <nav class="topbar"><a class="back" href="index.html#menu">← กลับไปดูเมนูทั้งหมด</a></nav>
  <main id="content"></main>
</div>

<footer>ทำด้วย ❤️ สำหรับคนรักอาหารไทย</footer>

<script src="dishes.js"></script>
<script>
  const STORE_KEY = "thaiFood.favorites.v1"; // ใช้คีย์เดียวกับ index.html เพื่อให้รายการที่ชอบตรงกัน

  // ไม่มี prototype เพื่อไม่ให้ id อย่าง "__proto__" หรือ "constructor" ถูกมองเป็นเมนู
  const byId = Object.assign(Object.create(null), Object.fromEntries(DISHES.map(d => [d.id, d])));
  const contentEl = document.getElementById("content");
  const noteEl = document.getElementById("storageNote");
  const favs = new Set();
  let canPersist = true;
  let shown = null;    // เมนูที่กำลังแสดง
  let favBtn = null;   // ปุ่มถูกใจของเมนูนั้น

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function loadFavs() {
    let raw = null;
    try { raw = localStorage.getItem(STORE_KEY); } catch (e) { canPersist = false; }
    if (raw) {
      try {
        const ids = JSON.parse(raw);
        if (Array.isArray(ids)) ids.forEach(id => { if (byId[id]) favs.add(id); });
      } catch (e) { /* ข้อมูลเสีย เริ่มจากรายการว่าง */ }
    }
    noteEl.hidden = canPersist;
  }

  function saveFavs() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify([...favs])); } catch (e) { canPersist = false; }
    noteEl.hidden = canPersist;
  }

  function syncFavButton(b, d) {
    const on = favs.has(d.id);
    b.setAttribute("aria-pressed", String(on));
    b.textContent = on ? "♥ ชอบแล้ว" : "♡ ถูกใจ";
    b.setAttribute("aria-label", (on ? "เลิกถูกใจ " : "ถูกใจ ") + d.th);
  }

  function renderMissing() {
    document.title = "ไม่พบเมนู | อาหารไทย ที่ต้องลอง";
    const box = el("div", "missing");
    box.append(el("h1", null, "ไม่พบเมนูที่ต้องการ"), el("p", null, "ลิงก์นี้อาจไม่ถูกต้อง ลองกลับไปเลือกเมนูจากหน้าแรก"));
    const back = el("a", "btn", "ดูเมนูทั้งหมด");
    back.href = "index.html#menu";
    back.style.marginTop = "20px";
    box.append(el("p"), back);
    contentEl.replaceChildren(box);
  }

  function pagerLink(d, text) {
    const a = el("a", "btn", text);
    a.href = "detail.html?id=" + encodeURIComponent(d.id);
    return a;
  }

  function renderDish(d) {
    document.title = d.th + " (" + d.en + ") | อาหารไทย ที่ต้องลอง";

    const pic = el("div", "pic", d.image ? undefined : d.emoji);
    if (d.image) {
      const img = el("img");
      img.src = d.image;
      img.alt = d.th;
      pic.append(img);
      pic.classList.add("has-img");
    } else {
      pic.setAttribute("aria-hidden", "true");
    }

    const fav = el("button", "fav");
    fav.type = "button";
    shown = d;
    favBtn = fav;
    syncFavButton(fav, d);
    fav.addEventListener("click", () => {
      if (favs.has(d.id)) favs.delete(d.id); else favs.add(d.id);
      saveFavs();
      syncFavButton(fav, d);
    });

    const head = el("div", "head");
    head.append(el("h1", null, d.th), fav);

    const spice = el("div", "meta", "ความเผ็ด: ");
    spice.append(el("b", null, d.spice ? "🌶️".repeat(d.spice) : "ไม่เผ็ด"));

    const tags = el("div", "tags");
    tags.append(el("span", "tag cat", d.cat));
    d.tastes.forEach(t => tags.append(el("span", "tag", t)));

    const body = el("div", "dish-body");
    body.append(head, el("div", "en", d.en), el("p", "desc", d.desc), spice, tags);

    const dish = el("article", "dish");
    dish.append(pic, body);

    const total = d.ingredients.reduce((n, g) => n + g.items.length, 0);
    const ing = el("section");
    ing.setAttribute("aria-labelledby", "ingTitle");
    const title = el("h2", "section-title", "ส่วนประกอบ");
    title.id = "ingTitle";
    const groups = el("div", "groups");
    d.ingredients.forEach(g => {
      const box = el("div", "group");
      const list = el("ul");
      g.items.forEach(i => list.append(el("li", null, i)));
      box.append(el("h3", null, g.group), list);
      groups.append(box);
    });
    ing.append(title, el("p", "section-sub", "รวม " + total + " อย่าง แบ่งเป็น " + d.ingredients.length + " กลุ่ม"), groups);

    const i = DISHES.indexOf(d);
    const prev = DISHES[(i - 1 + DISHES.length) % DISHES.length];
    const next = DISHES[(i + 1) % DISHES.length];
    const pager = el("nav", "pager");
    pager.setAttribute("aria-label", "เมนูอื่น");
    pager.append(pagerLink(prev, "← " + prev.th), pagerLink(next, next.th + " →"));

    contentEl.replaceChildren(dish, ing, pager);
  }

  // กลับมาจาก back-forward cache หรือมีการแก้ไขจากแท็บอื่น: อ่านรายการที่ชอบจาก localStorage ใหม่
  function resyncFavs() {
    favs.clear();
    loadFavs();
    if (shown) syncFavButton(favBtn, shown);
  }
  window.addEventListener("pageshow", e => { if (e.persisted) resyncFavs(); });
  window.addEventListener("storage", e => { if (e.key === null || e.key === STORE_KEY) resyncFavs(); });

  loadFavs();
  const id = new URLSearchParams(location.search).get("id");
  const dish = id && byId[id];
  if (dish) renderDish(dish); else renderMissing();
</script>
</body>
</html>
